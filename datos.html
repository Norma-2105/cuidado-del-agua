<body>
    <div class="contenedor">
        <div class="encabezado">
            <div class="a1">
            </div>
            <div class="a1"> <a href="plantilla.html"><h2>Consumo de agua para promover estrategias que vinculen el cuidado del medio ambiente con salud personal y colectivo.</h2></a></div>

        <div class="cuerpo">
           
            <div class="contenedor4">

<canvas id="graficaProductos" width="400" height="200"></canvas>

<script>
fetch('buscar.php')
    .then(response => response.json())
    .then(data => {
        const nombres = data.map(item => item.Nombre);
        const cantidades = data.map(item => item.Vasos);

        const ctx = document.getElementById('graficaProductos').getContext('2d');
        new Chart(ctx, {
            type: 'bar',  // tipo de gráfico: barra
            data: {
                labels: nombres,
                datasets: [{
                    label: 'Consumo de Agua',
                    data: cantidades,
                    backgroundColor: 'rgba(54, 162, 235, 0.5)'
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    })
    .catch(error => console.error('Error cargando los datos:', error));
</script>


                    
            
            </div>
        </div>
        <div class="pie">Datos de contacto </div>
    </div>
</body>
</html>
